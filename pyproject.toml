[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worlddreamer-v5"
version = "0.1.0"
description = "worlddreamer-v5 multi-robot training and RoboFactory evaluation"
requires-python = ">=3.10,<3.11"
license-files = ["licenses/*.txt"]
dependencies = ["numpy==1.26.4", "PyYAML>=6,<7", "Pillow>=10,<12", "scipy>=1.11,<2"]

[project.optional-dependencies]
model = [
  "torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1",
  "accelerate==1.11.0", "safetensors==0.8.0", "h5py>=3.14,<4", "eva-decord==0.6.1",
  "diffusers @ https://github.com/huggingface/diffusers/archive/fc77592427a3ad802ff4924ede31541d809097a2.tar.gz",
]
train = ["lightning==2.5.3", "deepspeed==0.18.9", "setuptools>=77,<81", "ninja>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"worlddreamer_v5.models" = ["profiles/*.json"]
